const BANK=[
 {id:'os01',s:'os',q:'TLB가 캐시하는 정보는?',o:['가상 페이지 번호에서 물리 페이지 번호로의 변환','디스크 파일 이름에서 블록 번호로의 변환','CPU 명령어의 실행 결과'],a:0,why:'TLB는 MMU 안의 주소 변환 캐시로, 가상 페이지 번호(VPN)와 물리 페이지 번호(PPN)의 매핑을 저장한다.',src:'08_TLB.pdf',page:11},
 {id:'os02',s:'os',q:'TLB hit가 발생하면 보통 무엇이 줄어들까?',o:['페이지 테이블 항목(PTE)을 읽기 위한 메모리 접근','프로세스가 쓰는 가상 주소의 비트 수','모든 캐시의 크기'],a:0,why:'TLB hit에서는 주소 변환 결과를 바로 얻을 수 있어 PTE 조회를 위한 메모리 접근을 피할 수 있다.',src:'08_TLB.pdf',page:13},
 {id:'os03',s:'os',q:'TLB miss는 반드시 page fault를 뜻할까?',o:['아니다. PTE를 조회하면 메모리에 있는 페이지일 수 있다','그렇다. 둘은 같은 예외다','TLB miss가 나면 반드시 시스템을 재부팅한다'],a:0,why:'TLB miss는 변환 정보가 TLB에 없다는 뜻이다. 페이지가 실제 메모리에 없는 page fault와 다르다.',src:'08_TLB.pdf',page:14},
 {id:'os04',s:'os',q:'같은 프로세스의 스레드들이 일반적으로 공유하는 것은?',o:['코드와 일부 데이터','각자의 프로그램 카운터와 스택 포인터','각 스레드의 독립적인 가상 주소 공간 전체'],a:0,why:'스레드는 같은 프로세스의 코드와 데이터를 공유하며, 스레드마다 레지스터 상태 및 스택은 따로 갖는다.',src:'12_Thread.pdf',page:33},
 {id:'os05',s:'os',q:'뮤텍스(lock)의 핵심 목적은?',o:['공유 데이터에 대한 상호 배제','모든 스레드의 실행을 항상 병렬화','디스크 장치의 속도를 증가'],a:0,why:'임계 구역의 명령이 다른 스레드와 위험하게 섞이지 않도록 상호 배제를 보장한다.',src:'13_Lock.pdf',page:21},
 {id:'os06',s:'os',q:'생산자–소비자 문제에서 생산자가 빈 버퍼 칸이 생길 때까지 기다리는 이유는?',o:['가득 찬 버퍼에 새 항목을 넣을 수 없어서','CPU 레지스터가 모두 초기화되어야 해서','모든 페이지가 TLB에 있어야 해서'],a:0,why:'공유 버퍼에는 용량이 있으므로 생산자는 빈 슬롯을 기다리고, 소비자는 항목이 들어오기를 기다린다.',src:'14_Semaphore.pdf',page:4},
 {id:'os07',s:'os',q:'DMA를 이용할 때 데이터 복사의 주된 수행 주체는?',o:['DMA 기능을 가진 장치/컨트롤러','사용자 프로그램의 명령어 반복 루프','CPU 레지스터 자체'],a:0,why:'DMA는 장치가 메모리로 데이터를 직접 전송하게 해 CPU의 데이터 복사 부담을 줄인다.',src:'17_IO.pdf',page:23},
 {id:'mp01',s:'mp',q:'ARM 어셈블리에서 LDR r0, [r1]의 의미는?',o:['r1이 가리키는 메모리의 워드를 r0로 읽는다','r0 값을 메모리 주소 r1에 저장한다','r1과 r0를 더한다'],a:0,why:'LDR은 load, STR은 store다. LDR r0,[r1]은 r1을 베이스 주소로 메모리를 읽는다.',src:'ARM-CH3.pdf',page:17},
 {id:'mp02',s:'mp',q:'ARM 어셈블리에서 STR r0, [r1]의 의미는?',o:['r0의 값을 r1이 가리키는 메모리에 저장','메모리에서 값을 r0로 로드','조건 없이 분기'],a:0,why:'STR은 register의 내용을 메모리로 기록한다. 반대 방향은 LDR이다.',src:'ARM-CH3.pdf',page:17},
 {id:'mp03',s:'mp',q:'ARM에서 B LABEL 명령의 기본 역할은?',o:['LABEL 위치로 무조건 분기','두 레지스터를 곱하기','메모리에서 데이터 읽기'],a:0,why:'B는 프로그램 제어 흐름을 지정한 레이블로 옮기는 무조건 분기 명령이다.',src:'ARM-CH3.pdf',page:32},
 {id:'mp04',s:'mp',q:'SSD의 주요 구성 요소로 강의에서 제시한 것은?',o:['SSD 컨트롤러와 NAND 플래시 메모리 칩','GPU와 DRAM만으로 구성된 보드','ROM 한 개와 키보드 컨트롤러'],a:0,why:'SSD는 컨트롤러와 NAND 플래시 칩들로 구성되고 컨트롤러가 관리 펌웨어를 실행한다.',src:'lecture2 _ SSDoverview2.pdf',page:3},
 {id:'mp05',s:'mp',q:'FTL(Flash Translation Layer)의 핵심 기능이 아닌 것은?',o:['CPU 명령어의 분기 예측','주소 변환','가비지 컬렉션과 웨어 레벨링'],a:0,why:'FTL은 논리–물리 주소 변환, 가비지 컬렉션, 배드 블록 관리, 웨어 레벨링 등을 담당한다.',src:'lecture7 _ Software1 _ Overview_BAST_FAST.pdf',page:4},
 {id:'mp06',s:'mp',q:'NAND Flash의 일반적인 특징으로 강의에서 강조하는 것은?',o:['고밀도·저비용, 데이터 저장에 적합','NOR보다 빠른 임의 바이트 접근','주로 CPU의 산술연산에 사용'],a:0,why:'슬라이드는 NAND의 고밀도/낮은 비용과 높은 지우기·쓰기 성능, 순차 데이터 저장 용도를 강조한다.',src:'lecture6 _ Hardware4 _ NAND.pdf',page:3},
 {id:'mp07',s:'mp',q:'SSD 관리 펌웨어에서 wear-leveling의 의도에 가장 가까운 것은?',o:['플래시 블록의 마모가 특정 블록에 집중되지 않도록 관리','모든 데이터를 항상 DRAM에 보관','플래시를 CPU의 레지스터로 대체'],a:0,why:'웨어 레벨링은 NAND 플래시의 제한된 프로그램/지우기 수명을 고려해 마모를 분산하는 관리 기능이다.',src:'lecture7 _ Software1 _ Overview_BAST_FAST.pdf',page:4},
 {id:'ml01',s:'ml',q:'Precision(정밀도)이 측정하는 것은?',o:['양성으로 예측한 항목 중 실제 양성인 비율','실제 양성 중 찾아낸 비율','전체 데이터 중 음성의 비율'],a:0,why:'Precision = TP/(TP+FP). 예측 양성의 품질을 보며, Recall은 실제 양성 중 찾아낸 비율이다.',src:'_ML_lec13_evaluating_classifiers.pdf',page:12},
 {id:'ml02',s:'ml',q:'Recall(재현율)이 측정하는 것은?',o:['실제 양성 중 양성으로 예측한 비율','양성으로 예측한 항목 중 양성 비율','전체 오류율'],a:0,why:'Recall = TP/(TP+FN). 실제 양성 대상을 놓치지 않고 얼마나 찾아냈는지를 나타낸다.',src:'_ML_lec13_evaluating_classifiers.pdf',page:20},
 {id:'ml03',s:'ml',q:'k-means의 기본적인 목표는?',o:['데이터를 중심점에 가까운 군집으로 묶기','시간 순서대로 데이터를 정렬하기','분류기의 정답 레이블을 자동 생성하기'],a:0,why:'k-means는 데이터 포인트와 할당된 군집 중심 사이의 거리를 기준으로 군집화를 수행한다.',src:'_ML_lec15_clustering.pdf',page:15},

const migrateOld=(old)=>{const s=empty();s.xp=Math.max(0,Number(old.xp)||0);s.gold=Math.max(0,Number(old.coins)||0)+25;s.sparks=Math.max(0,Number(old.sparks)||0)+1;s.wood=12;s.stone=6;s.decor={...(old.items||{})};s.questSteps={};s.done={...(old.completed||{})};for(const [key,value] of Object.entries(old.completed||{})){if(value&&key.startsWith('todoDone:'))s.todoDone[key.slice(9)]=true;}s.focusRecords=Array.isArray(old.sessions)?old.sessions.map(x=>({...x,legacy:true})):[];s.lifeRecords=Array.isArray(old.meals)?old.meals.map(x=>({date:x.date,type:x.name,start:x.start,end:x.end,legacy:true})):[];s.events=Array.isArray(old.events)?old.events.map(x=>({date:x.date,time:x.time,kind:x.type||'legacy',title:x.title,icon:x.icon})):[];s.todoSnapshot=Array.isArray(old.todos)?old.todos.map(x=>({...x,id:x.id||x.key})):START_TODOS.map(x=>({...x}));s.custom=Array.isArray(old.custom)?old.custom.map(x=>({...x,id:x.id||x.key})):[];s.todoImportedAt=String(old.importAt||'이전 v0.1에서 복원');s.relics=Array.from({length:Math.min(3,Number(old.items?.relic)||0)},(_,i)=>`이전 유물 ${i+1}`);s.legacy={from:'v0.1',sourceKey:OLD,importedAt:Date.now(),backup:old};if(old.active&&old.active.id){const a=old.active;s.active={questId:a.id,title:a.title||'이전 퀘스트',step:0,minutes:a.minutes||3,startedAt:a.startAt||Date.now(),elapsed:a.elapsed||0,paused:!!a.paused,kind:'legacy'};}return s};

<div class="section-heading"><h2>📣 지금 할 퀘스트 ${infoBtn('main')}</h2><small class="tiny">${h(fmt(dt()))}</small></div><div class="featured"><div class="featured-inner"><div class="panel-row"><div class="emblem gold">${q.kind==='active'?'⏳':'!'}</div><div class="grow"><div class="eyebrow">${q.kind==='active'?'진행 중 · 이어하기':'추천 · 지금 시작하기'}</div><h2>${h(q.title)}</h2><p>${h(q.desc)}</p></div></div><button class="btn gold wide" data-act="${q.kind==='active'?'resume':'open-quest'}" data-id="${h(q.id)}">▶ ${q.kind==='active'?'이어서 진행':'지금 시작하기'}</button></div></div>

<div class="section-heading"><h2>✨ 가볍게 한 번 더 ${infoBtn('quick')}</h2></div><div class="grid2"><button class="quick" data-act="tab" data-tab="study"><span class="big">📖</span><b>강의 복습 1문제</b><small>해설 확인 후 보상</small></button><button class="quick" data-act="life"><span class="big">🍱</span><b>생활 시간 기록</b><small>시작·종료만 입력</small></button></div><button class="growth-link" data-act="tab" data-tab="store"><span>⚒️ <strong>왕국 발전</strong> · 장비 · 시설 · 개척 연대기 ${milestoneAt()}/30</span><span>›</span></button></section>`};

const questCard=(q)=>{const t=q.todo,p=t?progress(t):0,steps=t?makeSteps(t):[],finished=t?p>=steps.length:!!q.done;return `<div class="quest-row ${finished?'done':''}"><div class="quest-info"><div class="emblem">${q.icon}</div><div class="grow"><span class="pill ${q.source==='Todo Mate'?'mint':'gold'}">${h(q.source)}</span><h3>${h(q.title)}</h3><p class="tiny">${h(q.desc)}</p>${t?`<div class="steps">${steps.map((_,i)=>`<span class="step-dot ${i<p?'done':i===p?'current':''}"></span>`).join('')}</div><div class="tiny">${p>=steps.length?'게임 내 진행 구간 완료':'다음: '+h(steps[p])}</div>`:''}</div></div><div class="quest-action"><span class="tiny">${t?`<button class="link" data-act="todo-done" data-id="${h(t.id||t.key)}">✓ 전체 끝냈어</button>`:finished?'✓ 구간 완료':q.reward||'🌟 XP · <span class="coin" aria-label="골드">G</span> 골드'}</span><button class="btn ${finished?'ghost':'gold'} small" data-act="open-quest" data-id="${h(q.id)}" ${finished?'disabled':''}>${finished?'구간 완료':'도전'}</button></div></div>`};
const questPage=()=>{const todos=availableTodos(),qstarter={id:'starter',title:'일 하나만 펼치기',desc:'해야 할 자료·화면을 펼치는 작은 시작',icon:'⚡',source:'시작 퀘스트',done:!!state.done[`starter:${dt()}`]};const qfocus={id:'focus',title:'자유 집중',desc:'1·3·10·25분 중 선택. 하루 첫 몇 번은 보너스.',icon:'⏱️',source:'반복 도전'};return `<section class="page"><h1 class="headtitle">📜 퀘스트 길드 ${infoBtn("quests")}</h1><p class="intro">하기 싫은 결정은 줄이고, 지금 할 행동만 보여줄게.</p><div class="section-heading"><h2>⚡ 아주 쉬운 시작</h2><small class="tiny">부담 없이</small></div>${questCard(qstarter)}${questCard(qfocus)}<div class="quest-row"><div class="quest-info"><div class="emblem">🍱</div><div class="grow"><span class="pill gold">생활 기록</span><h3>식사·생활 시간 남기기</h3><p class="tiny">언제부터 언제까지 했는지만 선택</p></div></div><div class="quest-action"><span class="tiny">오늘 첫 기록은 보너스</span><button class="btn gold small" data-act="life">기록</button></div></div>
 <div class="section-heading"><h2>📌 오늘의 Todo Mate ${infoBtn("todos")}</h2><small class="tiny">${todos.length}개 남음</small></div>${todos.length?todos.map(t=>questCard({id:questId(t),title:t.content,desc:`${t.category||'할 일'}${t.remind?' · '+t.remind+' 예정':''}`,icon:/수면|취침/.test(t.content)?'🌙':'📚',source:t.origin==='custom'?'직접 입력':'Todo Mate',todo:t})).join(''):'<div class="empty">오늘 가져온 미완료 할 일이 없어.<br>새 퀘스트를 추가하거나 연구부터 시작해봐.</div>'}
 <button class="btn ghost wide mt12" data-act="add-todo">＋ 게임에 임시 할 일 추가</button><div class="notice">🔗 Todo Mate 데이터는 <strong>${h(state.todoImportedAt)}</strong> 기준의 사본이야. 중간 단계나 '완료'는 게임 안에만 기록돼. 원본 Todo Mate는 변경되지 않아.</div></section>`};
const due=(card)=>!!state.study.seen[card.id]&&state.study.seen[card.id].next<=dt();
const newStudy=(card)=>!state.study.seen[card.id];
const matchingCards=()=>BANK.filter(x=>state.study.subject==='all'||x.s===state.study.subject);
const nextStudyDate=()=>matchingCards().filter(x=>state.study.seen[x.id]&&state.study.seen[x.id].next>dt()).map(x=>state.study.seen[x.id].next).sort()[0]||null;
const studyPage=()=>{const selected=state.study.subject,pool=matchingCards(),rev=pool.filter(due),unseen=pool.filter(newStudy),next=nextStudyDate(),answered=Object.keys(state.study.answeredToday).filter(x=>x.startsWith(dt()+':')).length;return `<section class="page"><h1 class="headtitle">📖 마법 연구소 ${infoBtn('study')}</h1><p class="intro">한 문제 → 답 선택 → 해설 확인. 틀린 개념은 다음 복습일에 다시 만나.</p><div class="tabfilters"><button class="filter ${selected==='all'?'active':''}" data-act="subject" data-subject="all">전체</button>${Object.entries(SUBJECTS).map(([k,v])=>`<button class="filter ${selected===k?'active':''}" data-act="subject" data-subject="${k}">${v.icon} ${v.name}</button>`).join('')}</div>
<div class="study-status"><div><strong>${rev.length}</strong><small>지금 복습</small></div><div><strong>${unseen.length}</strong><small>새 문제</small></div><div><strong>${pool.length-rev.length-unseen.length}</strong><small>복습 대기</small></div></div>
<div class="btnrow mt12"><button class="btn ${rev.length?'gold':'ghost'}" data-act="start-review" ${rev.length?'':'disabled'}>↻ 복습 시작${rev.length?` (${rev.length})`:''}</button><button class="btn ${unseen.length?'mint':'ghost'}" data-act="start-new" ${unseen.length?'':'disabled'}>＋ 새 개념${unseen.length?` (${unseen.length})`:''}</button></div>
<div class="tiny mt8">${!rev.length&&next?`다음 복습: ${h(next)}`:rev.length?'복습할 문제가 있으면 그쪽부터 진행할 수 있어.':'예정된 복습이 없어. 새 문제를 골라도 돼.'} · 오늘 보상 받은 문제 ${Math.min(6,answered)}/6</div>
<details class="study-list"><summary>📚 문제 목록에서 직접 고르기 (${pool.length}문제)</summary><div class="study-entries">${pool.map(q=>{const seen=state.study.seen[q.id],tag=seen?(due(q)?'복습 가능':`다음 ${seen.next}`):'새 문제';return `<button class="study-entry" data-act="study-card" data-id="${q.id}"><span class="grow">${h(q.q)}<small>${h(SUBJECTS[q.s].name)} · ${h(tag)}</small></span><span>›</span></button>`}).join('')}</div></details>

const zoneCard=(z)=>{const open=zoneOpen(z),current=selectedZone===z.id;return `<button class="mapnode z${ZONES.indexOf(z)} ${current?'active':''} ${!open?'locked':''}" data-act="zone" data-id="${z.id}"><span>${open?z.icon:'🔒'}</span><small>${z.name}</small></button>`};

 <div class="section-heading"><h2>💎 발견한 유물</h2><small class="tiny">${state.relics.length}개</small></div><div class="inventory">${state.relics.length?state.relics.slice().reverse().map(x=>`<div class="itembox"><span class="emoji">💎</span><strong>${h(x)}</strong></div>`).join(''):'<div class="empty" style="grid-column:1/-1">첫 탐험에서 새로운 유물을 발견할 수 있어!</div>'}</div></section>`};
const buildingCard=(b)=>{const n=state.buildings[b.id]||0,c=costOf(b);return `<div class="building"><span class="emoji">${b.icon}</span><span class="pill ${n?'mint':''}">${n?'LV.'+n:'미건설'}</span><h3 class="mt8">${b.name}</h3><p>${b.desc}${n&&b.rate?' · '+(Math.round(n*60/b.rate))+'개/시간':''}</p><div class="tiny mt8">${costText(c)}</div><button class="btn ${enough(c)?'gold':'ghost'} mt8" data-act="build" data-id="${b.id}" ${!enough(c)||n>=MAX_BUILDING?'disabled':''}>${n>=MAX_BUILDING?'최고 단계':n?'업그레이드':'건설하기'}</button></div>`};
const gearCard=(g)=>{const n=state.gear[g.id]||0,up=n<MAX_GEAR,c=gearCost(g),affordable=up&&enough(c);return `<div class="gear-card"><div class="gear-top"><div class="gear-emblem">${g.icon}</div><div class="grow"><div class="gear-head"><strong>${g.name}</strong><span class="pill ${n?'mint':''}">LV.${n}/${MAX_GEAR}</span></div><p>${g.desc}</p></div></div><div class="gear-effect"><span>현재<br><b>${g.effect(n)}</b></span><span class="gear-arrow">→</span><span>${up?'강화 후':'성장 완료'}<br><b>${up?g.effect(n+1):g.effect(n)}</b></span></div><div class="gear-footer"><div class="gear-cost">${up?`필요 재료<br>${costText(c)}`:'최대 레벨 달성'}</div><button class="btn ${affordable?'gold':'ghost'}" data-act="gear" data-id="${g.id}" ${!affordable?'disabled':''}>${up?'강화하기':'최대 레벨'}</button></div></div>`};
const storePage=()=>{const p=production(),claimed=!!state.chests[dt()],count=uniqueRealToday();const panes=[['gear','🛡️','장비'],['build','🏗️','시설'],['milestone','🏅','연대기'],['decor','🛍️','꾸미기']];const head=`<section class="page"><h1 class="headtitle">⚒️ 왕국 발전</h1><div class="tabfilters growth-tabs">${panes.map(([k,ic,label])=>`<button class="filter ${storePane===k?'active':''}" data-act="store-pane" data-pane="${k}">${ic} ${label}</button>`).join('')}</div>`;

const openQuest=(id)=>{if(state.active){showActive();return}if(id==='starter'){if(state.done[`starter:${dt()}`])return toast('오늘 시작 퀘스트는 이미 완료했어!');return overlay(`<span class="eyebrow">FIRST STEP</span><h2>⚡ 일 하나만 펼치기</h2><p>자료, 해야 할 일, 과제 파일 중 하나를 지금 눈앞에 꺼내봐. 완성할 필요는 없어. <strong>일단 열어둔 것 자체가 첫 걸음</strong>이야.</p><div class="notice">체크 전에 실제로 자료를 열어줘. 이 퀘스트는 오늘 한 번만 보상받아.</div><button class="btn gold wide mt12" data-act="complete-starter">✓ 자료를 펼쳤어</button>`)}
 if(id==='focus')return prepareSession({id:'focus',title:'자유 집중',desc:'지금 하려던 일을 조금이라도 실제로 진행해.',kind:'focus',icon:'🎯',step:0});
 if(id==='active')return showActive();
 if(id.startsWith('todo:')){const t=getTodos().find(x=>questId(x)===id);if(!t)return toast('이미 완료되었거나 목록에서 찾지 못한 할 일이야.');const steps=makeSteps(t),p=progress(t);if(p>=steps.length)return toast('단계는 모두 끝났어. 전체 완료를 확인해줘.');const first=p===0;const desc=first?'첫 단계는 자료나 준비물만 열어도 돼. 부담 없이 시작해봐.':'실제로 행동하고 나서 돌아와 확인하면 돼.';return prepareSession({id,title:t.content,desc,kind:'todo',icon:/수면|취침/.test(t.content)?'🌙':'📚',step:p,stepTitle:steps[p],instant:first||/준비 끝내기/.test(steps[p])});}

let chosenSession=null;

const updateMinutes=(val)=>{modeMinutes=val;prepareSession(chosenSession);modeMinutes=val;const modal=document.querySelector('.modal');if(modal){const row=modal.querySelectorAll('[data-act="minutes"]');row.forEach(b=>b.classList.toggle('gold',Number(b.dataset.min)===val));row.forEach(b=>b.classList.toggle('ghost',Number(b.dataset.min)!==val))}};
const openSession=()=>{const q=chosenSession;if(!q)return;state.active={questId:q.id,title:q.stepTitle||q.title,step:q.step,minutes:modeMinutes,startedAt:Date.now(),elapsed:0,paused:false,kind:q.kind,origTitle:q.title};persist();showActive();render()};
const activeElapsed=()=>{const a=state.active;if(!a)return 0;return Math.max(0,(a.elapsed||0)+(a.paused?0:Date.now()-a.startedAt))};

 const focused=state.events.filter(x=>x.date===dt()&&x.kind==='real'&&x.info==='focus').length;const amounts=focused<3?(short?{xp:6,gold:5}:{xp:20+a.minutes,gold:13+a.minutes,sparks:1,wood:1}):{xp:2,gold:2};log(focused<3?'real':'game',`자유 집중 ${mins}분`,'🎯','focus');grant(short?'짧게 실천했어!':'집중 퀘스트 완료!',focused>=3?'반복 플레이는 가능하지만 보상은 조금씩 줄어들어.':'짧은 행동이 다음 성장을 위한 재료가 됐어.',amounts,'🎯')};
const finishTodo=(id)=>{const t=getTodos().find(x=>(x.id||x.key)===id);if(!t)return;if(!confirm(`'${t.content}'을(를) 현실에서 완전히 끝냈나요?\n\n이 게임 안에서만 완료 처리하며 Todo Mate 원본은 바뀌지 않습니다.`))return;state.todoDone[id]=true;log('real',t.content+' · 전체 완료','✅','전체 완료');grant('현실 할 일 전체 완료!','Todo Mate 원본의 완료 체크는 별도로 확인해야 해.',{xp:35,gold:28,sparks:2,stone:2},'🏆')};
const lifeModal=()=>{overlay(`<span class="eyebrow">LIFE JOURNAL</span><h2>🍱 생활 시간 기록</h2><p>크게 분석하지 않아도 괜찮아. 방금 무엇을 언제부터 언제까지 했는지만 남겨봐.</p><div class="field"><label for="lifeType">무엇을 기록할까?</label><select id="lifeType"><option>점심</option><option>아침</option><option>저녁</option><option>수면</option><option>공부</option><option>수업</option><option>준비/이동</option><option>휴식</option><option>약속</option><option>폰</option></select></div><div class="twocol"><div class="field"><label for="lifeStart">시작</label><input id="lifeStart" type="time" value="12:00" required></div><div class="field"><label for="lifeEnd">끝</label><input id="lifeEnd" type="time" value="12:30" required></div></div><div class="field"><label for="lifeNote">메모 (선택)</label><input id="lifeNote" maxlength="100" placeholder="그냥 비워도 돼"></div><button class="btn gold wide" data-act="save-life">✓ 시간 기록하고 돌아가기</button>`)};
const saveLife=()=>{const type=document.getElementById('lifeType')?.value,start=document.getElementById('lifeStart')?.value,end=document.getElementById('lifeEnd')?.value,note=document.getElementById('lifeNote')?.value?.trim()||'';if(!start||!end||end<=start)return toast('끝 시각은 시작 시각보다 늦게 입력해줘.');const same=state.lifeRecords.some(x=>x.date===dt()&&x.type===type&&x.start===start&&x.end===end);if(same)return toast('이미 동일한 기록이 있어.');const icon={점심:'🍱',아침:'🥣',저녁:'🍚',수면:'🌙',공부:'📚',수업:'🎓','준비/이동':'🚶',휴식:'🍵',약속:'💌',폰:'📱'}[type]||'🕒';const n=state.lifeRecords.filter(x=>x.date===dt()&&x.rewarded).length,was=state.lifeRecords.some(x=>x.date===dt()&&x.type===type&&x.rewarded);const rewarded=n<3&&!was;state.lifeRecords.push({date:dt(),type,start,end,note,icon,rewarded});log(rewarded?'real':'record',type+' 시간 기록',icon,start+'–'+end);if(rewarded)grant(type+' 기록 완료',`${start}부터 ${end}까지. 기록만 해도 작은 보상을 얻었어.`,{xp:12,gold:10,sparks:1},icon);else{persist();closeModal();render();toast('시간을 기록했어. 오늘 같은 종류의 보상은 한 번만 지급돼.')}};
const addTodoModal=()=>overlay(`<span class="eyebrow">SIDE QUEST</span><h2>✍️ 게임에 임시 할 일 추가</h2><p>Todo Mate 원본은 변경되지 않아. 할 일을 한 줄만 적으면 게임이 작은 행동으로 나눠줄게.</p><div class="field"><label for="newTodo">할 일 이름</label><input id="newTodo" maxlength="90" placeholder="예: 시스템반도체 과제 2번 풀기"></div><button class="btn gold wide" data-act="save-todo">퀘스트 추가하기</button>`);
const saveTodo=()=>{const v=document.getElementById('newTodo')?.value?.trim();if(!v)return toast('할 일 이름을 적어줘.');state.custom.push({id:'custom-'+Date.now()+'-'+Math.floor(Math.random()*999),content:v,date:dt(),category:'게임에서 추가',isDone:false,origin:'custom'});persist();closeModal();render();toast('퀘스트를 추가했어!')};
const shuffleChoices=(q)=>{const seed=q.id.split('').reduce((a,c)=>a*31+c.charCodeAt(0),17)+Number(dt().replace(/-/g,''));let order=[0,1,2];for(let i=2;i>0;i--){let j=Math.abs((seed*17+i*13)>>>0)%(i+1);[order[i],order[j]]=[order[j],order[i]]}return order};
const startStudy=(kind='auto')=>{const pool=matchingCards();let q;if(kind==='review')q=pool.find(due);else if(kind==='new')q=pool.find(newStudy);else if(kind==='any')q=pool[Math.floor(Math.random()*pool.length)];else if(kind&&BANK.some(x=>x.id===kind))q=BANK.find(x=>x.id===kind);else q=pool.find(due)||pool.find(newStudy)||pool[0];if(!q)return toast('선택한 범위에 가능한 문제가 없어. 과목을 바꿔봐.');quizId=q.id;quizSelected=null;quizOrder=shuffleChoices(q);drawQuiz()};

const drawQuiz=()=>{const q=BANK.find(x=>x.id===quizId);if(!q)return;const finished=quizSelected!==null;const correct=finished&&quizSelected===q.a;overlay(`<span class="eyebrow">${h(SUBJECTS[q.s].icon)} ${h(SUBJECTS[q.s].name)} · 연구의 주문</span><h2>📚 지식의 문</h2><div class="study-question">${h(q.q)}</div><div class="answers">${quizOrder.map((option,i)=>`<button class="answer ${finished?(option===q.a?'correct':option===quizSelected?'wrong':''):''}" data-act="answer" data-index="${option}" ${finished?'disabled':''}><span style="opacity:.7;margin-right:9px">${i+1}.</span>${h(q.o[option])}</button>`).join('')}</div>${finished?`<div class="explain"><strong>${correct?'✓ 정확해!':'↻ 좋은 복습 기회야.'}</strong><br>${h(q.why)}<div class="source">출처: ${h(q.src)} · PDF ${q.page}쪽</div></div><button class="btn mint wide" data-act="finish-study">해설 확인 · 연구 완료 ✓</button>`:`<div class="source">출처: ${h(q.src)} · PDF ${q.page}쪽</div>`}`)};
const finishStudy=()=>{const q=BANK.find(x=>x.id===quizId);if(!q||quizSelected===null)return;const doneKey=dt()+':'+q.id,already=!!state.study.answeredToday[doneKey],count=Object.keys(state.study.answeredToday).filter(x=>x.startsWith(dt()+':')).length,correct=quizSelected===q.a;const prior=state.study.seen[q.id]||{attempts:0,streak:0,correct:0};if(!already){const streak=correct?Math.min(8,prior.streak+1):0,days=correct?[1,3,7,14,30][Math.min(streak-1,4)]:1;const dateObj=new Date(dt()+'T12:00:00+09:00');dateObj.setUTCDate(dateObj.getUTCDate()+days);const dp=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(dateObj),vals={};dp.forEach(x=>vals[x.type]=x.value);state.study.seen[q.id]={attempts:prior.attempts+1,correct:prior.correct+(correct?1:0),streak,next:`${vals.year}-${vals.month}-${vals.day}`};state.study.answeredToday[doneKey]=true;}
 log('study',`${SUBJECTS[q.s].name} 개념 복습`,'📖',correct?'정답':'해설 확인');const amounts=!already&&count<6?{xp:13,gold:8,insight:2+(state.gear.rune||0),sparks:1}:{};quizId=null;quizSelected=null;grant('연구 완료!',correct?'기억에서 직접 떠올렸어. 다음 복습 날짜에도 다시 만날 거야.':'해설을 읽었다면 오늘은 충분해. 내일 다시 떠올려 보자.',amounts,'🔮')};
const startDispatch=(zoneId,minutes)=>{const z=ZONES.find(x=>x.id===zoneId);if(!z||!zoneOpen(z)||state.dispatch)return;if(state.sparks<z.cost)return toast('탐험 불씨가 부족해. 현실 퀘스트나 연구로 얻어봐.');state.sparks-=z.cost;state.expCount++;state.dispatch={zone:z.id,startAt:Date.now(),endAt:Date.now()+gearTime(minutes)*1000,minutes,expNo:state.expCount,bonusRoll:Math.random()};log('game',z.name+' 탐험 출발','🧭',`${minutes}분`);persist();render();toast('탐험대가 출발했어. 게임을 꺼도 진행돼!')};
const collectDispatch=()=>{const ex=state.dispatch;if(!ex||Date.now()<ex.endAt)return;const z=ZONES.find(x=>x.id===ex.zone);if(!z)return;state.dispatch=null;state.expCountCollected=(state.expCountCollected||0)+1;const mult=ex.minutes===8?2:1;const a={};for(const [k,v]of Object.entries(z.loot))a[k]=Math.ceil(v*mult*(1+.10*(state.gear.pack||0)));a.insight=(a.insight||0)+(state.gear.lens||0);let surprise='';if(ex.bonusRoll<0.08){a.insight=(a.insight||0)+2;surprise=' · 비밀 마법의 흔적!';}else if(ex.bonusRoll<0.27){a.gold=(a.gold||0)+9;surprise=' · 숨겨진 금화 발견!';}let discovery=z.relics.find(x=>!state.relics.includes(x));if(discovery){state.relics.push(discovery)}else{a.gold=(a.gold||0)+10}log('game',z.name+' 탐험 귀환','🎒',(discovery?`유물: ${discovery}`:'기존 지역 재탐험')+surprise);const oldLv=level().n;for(const [k,v]of Object.entries(a))state[k]+=v;persist();render();rewardModal(discovery?`💎 ${discovery} 발견!`:'탐험 성공!',discovery?`${z.name}에서 새로운 유물을 발견했어!${surprise}`:`${z.name}을 다시 탐험해 자원을 모았어.${surprise}`,a,discovery?'💎':'🎒')};
const chest=()=>{if(uniqueRealToday()<2||state.chests[dt()])return;state.chests[dt()]=true;log('game','길드 보물상자 수령','🎁');grant('길드 보상 획득!','오늘의 현실 행동 두 번으로 길드의 선물을 열었어.',{gold:35,wood:3,stone:2,insight:1},'🎁')};
const buyDecor=(id)=>{const item=DECOR.find(x=>x.id===id);if(!item||state.decor[id]||state.gold<item.cost)return;state.gold-=item.cost;state.decor[id]=true;log('game',item.name+' 구입',item.icon);persist();render();rewardModal(item.name+' 획득!',item.desc,{},item.icon)};
const importTodos=()=>{let raw=document.getElementById('todosJson')?.value?.trim();if(!raw)return toast('먼저 JSON을 붙여 넣어줘.');try{const parsed=JSON.parse(raw),xs=Array.isArray(parsed)?parsed:Array.isArray(parsed.items)?parsed.items:Array.isArray(parsed.todos)?parsed.todos:null;if(!xs||xs.length>400)throw Error('최대 400개 목록 배열을 사용해줘.');const all=xs.map(x=>{if(!x||typeof x.content!=='string'||!x.content.trim())throw Error('할 일 제목이 없는 항목이 있어.');const date=String(x.formattedDate||x.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('날짜가 없는 항목이 있어.');const id=String(x.id||x.key||`${date}:${x.goalID||x.category||''}:${x.content}`).slice(0,240),remind=String(x.formattedRemindAt||x.remind||'');return{id,content:x.content.trim().slice(0,180),date,category:String(x.category||x.goalTitle||x.goalID||'할 일').slice(0,60),remind:remind.slice(0,70),isDone:!!x.isDone}});const ids=new Set(all.map(x=>x.id));if(ids.size!==all.length)throw Error('중복 ID가 있어.');if(!confirm(`Todo Mate 사본 목록을 ${all.length}개 항목으로 갱신할까?\n\n게임에서 이미 진행한 퀘스트와 게임 보상은 그대로 유지해.`))return;state.todoSnapshot=all;state.todoImportedAt=dt()+' '+tm()+' · 수동 갱신';log('game','할 일 목록 수동 갱신','🔗',all.length+'개');persist();render();toast('ID를 유지한 채 목록을 갱신했어.')}catch(e){toast('가져오기 실패: '+String(e.message||e).slice(0,100))}};
const exportSave=()=>{try{const blob=new Blob([JSON.stringify({app:'firstlight-rpg',schema:2,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Questline_v0.3_backup_'+dt()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('게임 백업 JSON을 다운로드했어.')}catch(e){toast('백업 생성에 실패했어.')}};
const importSave=(file)=>{if(!file)return;if(file.size>8*1024*1024)return toast('백업 파일이 너무 커. 8MB 이하여야 해.');const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='firstlight-rpg'||![1,2].includes(obj.schema)||!obj.data)throw Error('다른 게임 또는 알 수 없는 백업 파일이야.');let candidate;if(obj.schema===1&&obj.data.v===1)candidate=migrateOld(obj.data);else if(obj.schema===2&&obj.data.v===2)candidate=obj.data;else throw Error('버전이 일치하지 않아.');if(!confirm('현재 v0.2 게임 진행을 이 백업으로 교체할까? 기존 진행이 사라질 수 있으니 먼저 현재 게임을 백업해.'))return;state=candidate;normalize();persist();closeModal();tab='home';render();toast('백업을 복원했어!')}catch(e){toast('복원 실패: '+String(e.message||e).slice(0,110))}};reader.onerror=()=>toast('파일을 읽지 못했어.');reader.readAsText(file)};
const resetGame=()=>{if(!confirm('레벨·성장·퀘스트·기록을 전부 초기화할까? 먼저 백업하는 것을 권장해.'))return;if(!confirm('마지막 확인. 정말 현재 게임 진행 전체를 초기화할까? v0.1 원본은 그대로 남아 있어.'))return;state=empty();state.firstOpen=true;persist();tab='home';render();toast('게임을 초기화했어.')};
document.addEventListener('click',e=>{const x=e.target.closest('[data-act]');if(!x)return;const a=x.dataset.act,id=x.dataset.id;
 if(a==='tab')return switchTab(x.dataset.tab);
 if(a==='close')return closeModal();
 if(a==='help')return help();
 if(a==='info')return openInfo(id);
 if(a==='gear')return upgradeGear(id);
 if(a==='milestone')return claimMilestone();
 if(a==='store-pane'){storePane=x.dataset.pane;render();return}
 if(a==='start-review')return startStudy('review');
 if(a==='start-new')return startStudy('new');
 if(a==='study-card')return startStudy(id);
 if(a==='open-quest')return openQuest(id);
 if(a==='resume')return showActive();
 if(a==='complete-starter')return completeStarter();
 if(a==='minutes')return updateMinutes(Number(x.dataset.min));
 if(a==='instant-step')return finishInstant();
 if(a==='start-session')return openSession();
 if(a==='pause')return pauseSession();
 if(a==='finish-session')return finishSession();
 if(a==='cancel-session'){if(confirm('이번 퀘스트를 취소할까? 보상은 없지만 기록된 다른 진행은 유지해.')){state.active=null;persist();render();closeModal()}return}
 if(a==='todo-done')return finishTodo(id);
 if(a==='life')return lifeModal();
 if(a==='save-life')return saveLife();
 if(a==='add-todo')return addTodoModal();
 if(a==='save-todo')return saveTodo();
 if(a==='claim')return claimProduction();
 if(a==='build')return build(id);
 if(a==='zone'){selectedZone=id;render();return}
 if(a==='dispatch')return startDispatch(id,Number(x.dataset.time));
 if(a==='collect-explore')return collectDispatch();
 if(a==='chest')return chest();
 if(a==='decor')return buyDecor(id);
 if(a==='subject'){state.study.subject=x.dataset.subject;persist();render();return}
 if(a==='subject-study'){state.study.subject=x.dataset.subject;persist();render();startStudy();return}
 if(a==='start-study')return startStudy();
 if(a==='answer'){if(quizId!==null&&quizSelected===null){quizSelected=Number(x.dataset.index);drawQuiz()}return}
 if(a==='finish-study')return finishStudy();
 if(a==='records')return switchTab('records');
 if(a==='import-todos')return importTodos();
 if(a==='export')return exportSave();
 if(a==='pick-import'){document.getElementById('importFile')?.click();return}
 if(a==='reset')return resetGame();
});
document.addEventListener('change',e=>{if(e.target.id==='importFile'){importSave(e.target.files?.[0]);e.target.value=''}});
document.getElementById('headerRecord').addEventListener('click',()=>switchTab('records'));
document.getElementById('headerHelp').addEventListener('click',help);
window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});
let prevDispatchDone=false,prevProductionHas=false,slowTick=0;
setInterval(()=>{const focus=document.querySelector('[data-countdown="focus"]');if(focus&&state.active){const remain=Math.max(0,state.active.minutes*60000-activeElapsed());focus.textContent=durationLeft(Date.now()+remain)}const expedition=document.querySelectorAll('[data-countdown="dispatch"]');expedition.forEach(n=>n.textContent=state.dispatch?durationLeft(state.dispatch.endAt):'');slowTick++;if(slowTick%15===0){const done=!!state.dispatch&&Date.now()>=state.dispatch.endAt,ready=productionAmount()>0;if((done!==prevDispatchDone||ready!==prevProductionHas)&&(tab==='home'||tab==='map'||tab==='store')&&!document.querySelector('#overlayRoot .overlay')){render()}prevDispatchDone=done;prevProductionHas=ready}},1000);
boot();
window.__QUESTLINE_DEBUG__={getState:()=>JSON.parse(JSON.stringify(state)),getBank:()=>BANK.length,production,level,save:()=>persist()};
})();
</script></body></html>
